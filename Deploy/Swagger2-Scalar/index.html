<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scalar</title>
  </head>

  <body>
    <div id="app"></div>

    <script src="./standalone.js"></script>
    <script>
      // The url option points to the document generated by the SampleApi demo, in the Swagger2 folder.
      // Change it to the address where your web server publishes the file, for example
      // /api/help/swagger.json, or copy the document next to this page and use ./swagger.json.
      Scalar.createApiReference('#app', {
        url: '../Swagger2/swagger.json',
        // The page opens with the dark theme. The switch at the bottom of the sidebar changes it.
        darkMode: true
      });
    </script>
  </body>
</html>
